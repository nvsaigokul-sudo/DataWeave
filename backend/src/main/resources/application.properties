spring.main.web-application-type=none
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.flyway.locations=classpath:db/migration/sqlite
spring.flyway.baseline-on-migrate=true

dataweave.cache.metadata.max-entries=500
dataweave.cache.metadata.ttl-seconds=1800
dataweave.cache.data-page.max-entries=200
dataweave.cache.data-page.ttl-seconds=300
dataweave.cache.dataset-preview.max-entries=50
dataweave.cache.dataset-preview.ttl-seconds=120
dataweave.cache.query-result.max-entries=100
dataweave.cache.query-result.ttl-seconds=60

dataweave.query.pool-size=4
dataweave.query.page-default-size=100
dataweave.query.connect-timeout-seconds=10
