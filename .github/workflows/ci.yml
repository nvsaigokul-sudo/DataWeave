name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle test
        shell: bash
        run: ./gradlew test --no-daemon

      - name: Headless smoke
        shell: bash
        run: ./gradlew :desktop:runHeadlessSmoke --no-daemon

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew :desktop:packageAppImage :desktop:packageDeb --no-daemon

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./gradlew :desktop:packageMsi :desktop:packageExe --no-daemon

      - name: Windows packaged app launch smoke
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          # Reproduce Access Bridge setups that trigger missing jdk.accessibility at AWT init.
          $accessProps = Join-Path $env:USERPROFILE '.accessibility.properties'
          Set-Content -Path $accessProps -Value 'assistive_technologies=com.sun.java.accessibility.AccessBridge' -Encoding Ascii

          $msi = Get-ChildItem -Path desktop/build/compose/binaries -Recurse -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI not found under desktop/build/compose/binaries' }
          Write-Host "Installing $($msi.FullName)"
          $log = Join-Path $env:RUNNER_TEMP 'dataweave-msi-install.log'
          $proc = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart', '/L*v', $log) -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Get-Content $log -Tail 80
            throw "msiexec failed with exit code $($proc.ExitCode)"
          }

          $installRoot = Join-Path ${env:ProgramFiles} 'DataWeave'
          $exe = Join-Path $installRoot 'DataWeave.exe'
          $jvmDll = Join-Path $installRoot 'runtime/bin/server/jvm.dll'
          $cfg = Join-Path $installRoot 'app/DataWeave.cfg'
          foreach ($path in @($exe, $jvmDll, $cfg)) {
            if (-not (Test-Path $path)) { throw "Missing expected install artifact: $path" }
          }

          $outFile = Join-Path $env:RUNNER_TEMP 'dataweave-smoke.out'
          $errFile = Join-Path $env:RUNNER_TEMP 'dataweave-smoke.err'
          $p = Start-Process -FilePath $exe -ArgumentList '--headless-smoke' -RedirectStandardOutput $outFile -RedirectStandardError $errFile -PassThru -NoNewWindow -Wait
          $stdout = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
          $stderr = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
          Write-Host "exit=$($p.ExitCode)"
          if ($stdout) { Write-Host $stdout }
          if ($stderr) { Write-Host $stderr }
          if ($stdout -match 'Failed to launch JVM') { throw 'Packaged exe reported Failed to launch JVM' }
          if ($p.ExitCode -ne 0) { throw "DataWeave.exe --headless-smoke exited $($p.ExitCode)" }
          if ($stdout -notmatch 'HEADLESS_SMOKE_OK') { throw 'Expected HEADLESS_SMOKE_OK in stdout' }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./gradlew :desktop:packageDmg :desktop:packagePkg --no-daemon

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/build/compose/binaries/**/*
          if-no-files-found: warn
