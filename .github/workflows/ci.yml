name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  downloads-verify:
    name: Verify download checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check SHA256SUMS against files in downloads/
        shell: bash
        run: ./scripts/verify-downloads-checksums.sh

  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle test
        shell: bash
        run: ./gradlew test --no-daemon

      - name: Headless smoke
        shell: bash
        run: ./gradlew :desktop:runHeadlessSmoke --no-daemon

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot xvfb

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew :desktop:packageAppImage :desktop:packageDeb --no-daemon

      - name: Linux packaged app launch smoke
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          DEB="$(find desktop/build/compose/binaries -name '*.deb' -print -quit)"
          if [ -z "$DEB" ]; then echo 'deb not found'; exit 1; fi
          EXTRACT="${RUNNER_TEMP}/dataweave-deb-root"
          rm -rf "$EXTRACT"
          dpkg-deb -x "$DEB" "$EXTRACT"
          DW="$EXTRACT/opt/dataweave/bin/DataWeave"
          test -x "$DW"
          "$DW" --diagnose | tee /tmp/dataweave-linux-diagnose.out
          grep -q '=== end diagnostics ===' /tmp/dataweave-linux-diagnose.out
          grep -q 'install.runtime.missing_required_modules=(none)' /tmp/dataweave-linux-diagnose.out
          "$DW" --headless-smoke | tee /tmp/dataweave-linux-headless.out
          grep -q 'HEADLESS_SMOKE_OK' /tmp/dataweave-linux-headless.out
          xvfb-run -a "$DW" --gui-smoke
          LAUNCH_LOG="${HOME}/.dataweave/logs/launch.log"
          test -f "$LAUNCH_LOG"
          grep -q 'GUI_SMOKE_OK' "$LAUNCH_LOG"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Windows package attempt $attempt"
            if ./gradlew :desktop:packageMsi :desktop:packageExe --no-daemon; then
              exit 0
            fi
            echo "Package failed; retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Windows packaged app launch smoke
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/ci/windows-packaged-smoke.ps1

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./gradlew :desktop:packageDmg :desktop:packagePkg --no-daemon

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/build/compose/binaries/**/*
          if-no-files-found: warn
