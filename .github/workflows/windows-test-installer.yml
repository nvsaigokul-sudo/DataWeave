# Build a Windows MSI from the checked-out ref for manual laptop testing.
# Does NOT publish GitHub Releases or touch v0.2.4 assets.
name: Windows test installer (no release)

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/release-v0.2.5-prep-d9c8
      - cursor/dataweave-product-v0.3.0-d9c8

permissions:
  contents: read

jobs:
  windows-msi:
    name: Windows MSI test artifact
    runs-on: windows-latest
    env:
      # When set, :desktop:packageMsi/:packageExe fail unless build.gradle.kts version matches.
      GRADLE_REQUIRE_VERSION_PREFIX: ${{ github.ref_name == 'cursor/dataweave-product-v0.3.0-d9c8' && '0.3.0' || '' }}
      DATAWEAVE_EXPECT_JPACKAGE_VERSION: ${{ github.ref_name == 'cursor/dataweave-product-v0.3.0-d9c8' && '1.3.0' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm build ref
        shell: bash
        run: |
          echo "github.ref=${{ github.ref }}"
          echo "github.ref_name=${{ github.ref_name }}"
          echo "github.sha=${{ github.sha }}"
          git log -1 --oneline

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle test
        shell: bash
        run: |
          EXTRA=
          if [ -n "$GRADLE_REQUIRE_VERSION_PREFIX" ]; then
            EXTRA="-PrequireProductVersionPrefix=$GRADLE_REQUIRE_VERSION_PREFIX"
          fi
          ./gradlew test :desktop:runHeadlessSmoke $EXTRA --no-daemon

      - name: Package MSI and EXE
        shell: bash
        run: |
          set -e
          EXTRA=
          if [ -n "$GRADLE_REQUIRE_VERSION_PREFIX" ]; then
            EXTRA="-PrequireProductVersionPrefix=$GRADLE_REQUIRE_VERSION_PREFIX"
          fi
          for attempt in 1 2 3; do
            echo "Windows package attempt $attempt"
            if ./gradlew :desktop:packageMsi :desktop:packageExe $EXTRA --no-daemon; then
              exit 0
            fi
            echo "Package failed; retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Windows packaged app launch smoke
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/ci/windows-packaged-smoke.ps1

      - name: Report version and SHA256
        shell: pwsh
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/ci/report-windows-installer-version.ps1

      - name: Stage installers for upload
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'test-installer-upload'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Get-ChildItem -Recurse desktop/build/compose/binaries -Include *.msi,*.exe |
            Copy-Item -Destination $staging -Force
          Get-ChildItem $staging | ForEach-Object { $_.Name }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TEST-windows-msi-${{ github.sha }}
          path: ${{ runner.temp }}/test-installer-upload/
          if-no-files-found: error
