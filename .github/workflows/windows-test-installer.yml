# Build a Windows MSI from the checked-out ref for manual laptop testing.
# Does NOT publish GitHub Releases or touch v0.2.4 assets.
name: Windows test installer (no release)

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/release-v0.2.5-prep-d9c8
      - cursor/dataweave-product-v0.3.0-d9c8

permissions:
  contents: read

jobs:
  windows-msi:
    name: Windows MSI test artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle test
        shell: bash
        run: ./gradlew test :desktop:runHeadlessSmoke --no-daemon

      - name: Package MSI and EXE
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Windows package attempt $attempt"
            if ./gradlew :desktop:packageMsi :desktop:packageExe --no-daemon; then
              exit 0
            fi
            echo "Package failed; retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Windows packaged app launch smoke
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/ci/windows-packaged-smoke.ps1

      - name: Report version and SHA256
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Recurse desktop/build/compose/binaries -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'MSI not found' }
          $hash = (Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLower()
          "MSI path: $($msi.FullName)"
          "MSI name: $($msi.Name)"
          "SHA256: $hash"
          "Gradle version: $(Select-String -Path build.gradle.kts -Pattern 'version = ' | ForEach-Object { $_.Line.Trim() })"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @"
          ## TEST Windows installer (not a release)

          | Field | Value |
          |-------|-------|
          | MSI | ``$($msi.Name)`` |
          | SHA256 | ``$hash`` |
          | Ref | ``${{ github.ref_name }}`` @ ``${{ github.sha }}`` |

          Download the **installers-windows-latest** artifact from this workflow run.
          "@

      - name: Stage installers for upload
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'test-installer-upload'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Get-ChildItem -Recurse desktop/build/compose/binaries -Include *.msi,*.exe |
            Copy-Item -Destination $staging -Force
          Get-ChildItem $staging | ForEach-Object { $_.Name }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TEST-windows-msi-${{ github.sha }}
          path: ${{ runner.temp }}/test-installer-upload/
          if-no-files-found: error
