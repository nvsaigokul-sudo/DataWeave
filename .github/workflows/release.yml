name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to rebuild (optional; default = ref that triggered push)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-14
            artifact: macos-arm64
          # macos-13 (Intel) omitted: runner queue often blocks publish; build locally with packageDmg/packagePkg on Intel Mac.

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Test
        shell: bash
        run: ./gradlew test :desktop:runHeadlessSmoke --no-daemon

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew :desktop:packageAppImage :desktop:packageDeb --no-daemon

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          EXTRA=
          if ./gradlew printProductVersion --no-daemon 2>&1 | grep -q 'dataweave.gradleVersion=0.3.0'; then
            EXTRA="-PrequireProductVersionPrefix=0.3.0"
          fi
          ./gradlew :desktop:packageMsi :desktop:packageExe $EXTRA --no-daemon

      - name: Windows packaged app launch smoke
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        env:
          DATAWEAVE_EXPECT_JPACKAGE_VERSION: ${{ startsWith(github.ref_name, 'v0.3.') && '1.3.0' || '' }}
        run: ./scripts/ci/windows-packaged-smoke.ps1

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./gradlew :desktop:packageDmg :desktop:packagePkg --no-daemon

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-staging
          find desktop/build/compose/binaries -type f \( \
            -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o \
            -name '*.dmg' -o -name '*.pkg' \) -print0 |
            while IFS= read -r -d '' f; do
              cp "$f" "release-staging/${{ matrix.artifact }}-$(basename "$f")"
            done
          ls -lah release-staging/
          test "$(ls -1 release-staging | wc -l)" -gt 0

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: dataweave-${{ matrix.artifact }}
          path: release-staging/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten artifacts, align Windows MSI with LFS, checksums
        shell: bash
        run: |
          find dist -mindepth 2 -type f -exec mv -n {} dist/ \;
          # CI-built Windows MSI is the release source of truth (do not swap in stale LFS bytes).
          CI_MSI=$(find dist -maxdepth 1 -name 'windows-*.msi' -print -quit)
          if [ -n "$CI_MSI" ] && [ -f "$CI_MSI" ]; then
            cp "$CI_MSI" dist/windows-DataWeave-Setup.msi
            echo "Release Windows MSI from CI: $(sha256sum "$CI_MSI")"
          else
            echo "WARNING: no CI windows-*.msi in dist; check windows package job"
          fi
          cd dist
          ls -lah
          sha256sum * | grep -v SHA256SUMS > SHA256SUMS.txt || shasum -a 256 * | grep -v SHA256SUMS > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo nvsaigokul-sudo/DataWeave 2>/dev/null || \
            gh release create "$TAG" --repo nvsaigokul-sudo/DataWeave \
              --title "DataWeave ${TAG}" \
              --notes-file - <<EOF
          ## Install DataWeave ${TAG}

          Download the installer for your operating system below. Each bundle includes a private Java runtime (no separate JDK install).

          | OS | Files |
          |----|-------|
          | Windows | \`.msi\` + \`.exe\` (jpackage version **1.x.y** for product **0.x.y** — see \`docs/VERSIONING.md\`) |
          | Linux | \`.AppImage\`, \`.deb\` |
          | macOS | \`.dmg\` / \`.pkg\` (Apple Silicon from macos-arm64, Intel from macos-x64) |

          Verify downloads with \`SHA256SUMS.txt\`.

          **Signing/notarization:** not applied in this release.

          **Known limits:** Remote PostgreSQL required for data browse; local SQLite stores app metadata only.
          EOF
          gh release upload "$TAG" dist/* --repo nvsaigokul-sudo/DataWeave --clobber
