name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-14
            artifact: macos-arm64
          - os: macos-13
            artifact: macos-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Test
        run: ./gradlew test :desktop:runHeadlessSmoke --no-daemon

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew :desktop:packageAppImage :desktop:packageDeb --no-daemon

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./gradlew :desktop:packageMsi :desktop:packageExe --no-daemon

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./gradlew :desktop:packageDmg :desktop:packagePkg --no-daemon

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-staging
          find desktop/build/compose/binaries -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.pkg' -o -name '*.app' \) -print -exec cp {} release-staging/ \; 2>/dev/null || true
          if [ -d desktop/build/compose/binaries/main/app ]; then
            tar -czf "release-staging/dataweave-linux-portable-${{ matrix.artifact }}.tar.gz" -C desktop/build/compose/binaries/main app
          fi
          ls -la release-staging/

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: dataweave-${{ matrix.artifact }}
          path: release-staging/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten artifacts and checksums
        run: |
          find dist -mindepth 2 -type f -exec mv -n {} dist/ \;
          find dist -type d -empty -delete 2>/dev/null || true
          cd dist
          ls -la
          sha256sum * 2>/dev/null | grep -v SHA256SUMS > SHA256SUMS.txt || shasum -a 256 * | grep -v SHA256SUMS > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          gh release create "$TAG" dist/* \
            --repo nvsaigokul-sudo/DataWeave \
            --title "DataWeave ${TAG}" \
            --notes "Installable desktop builds for Windows, Linux, and macOS. Bundled private JRE via jpackage. Signing/notarization: not applied — verify SHA256SUMS.txt."
